# EE-DOC-007 §09 / EE-IMP-007-P05 / EE-ADR-003 — Platform CI (least privilege)
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # historial completo para Gitleaks

      - name: Secret detection (QG-SEC-002)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.21.2"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          CHECKSUMS="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          # Descargar binario y archivo de checksums
          curl -sSL -o "$TARBALL" "${BASE_URL}/${TARBALL}"
          curl -sSL -o "$CHECKSUMS" "${BASE_URL}/${CHECKSUMS}"

          # Verificar la integridad (falla si el SHA no coincide)
          sha256sum -c "$CHECKSUMS" --ignore-missing

          # Descomprimir y ejecutar
          tar -xzf "$TARBALL" gitleaks
          ./gitleaks detect --source . --verbose --exit-code 1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Validate
        run: pnpm run validate
