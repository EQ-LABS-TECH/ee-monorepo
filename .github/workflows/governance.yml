# PN-017 — Trusted governance verification.
# Automatic validation; not yet a required check.
name: Governance Verification
run-name: ${{ github.event_name == 'pull_request_review' && 'Governance review relay' || 'Governance Verification' }}

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  issue_comment:
    types:
      - created
      - edited
      - deleted
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number
      head_sha:
        description: Exact PR HEAD commit SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-governance-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: PR Governance Verify
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: governance-main

    permissions:
      contents: read
      pull-requests: read
      checks: read

    steps:
      - name: Checkout trusted implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve current PR HEAD
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_HEAD_SHA: ${{ inputs.head_sha || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { validateRequestedPrGovernanceHead } from '@eq-labs/governance/pr-governance/workflow';
          import { resolvePrGovernanceRoute } from './scripts/lib/pr-governance.resolve.mjs';

          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');

          const resolved = await resolvePrGovernanceRoute({
            route: {
              status: 'READY',
              scope: 'PR_SCOPE',
              owner,
              repo,
              number: Number(process.env.PR_NUMBER),
            },
            token: process.env.GITHUB_TOKEN,
          });

          if (resolved.baseRef !== 'main') {
            throw new Error('Unexpected PR base branch');
          }

          validateRequestedPrGovernanceHead({
            eventName: process.env.GITHUB_EVENT_NAME,
            requestedHeadSha: process.env.REQUESTED_HEAD_SHA,
            resolvedHeadSha: resolved.expectedHeadSha,
          });

          appendFileSync(
            process.env.GITHUB_ENV,
            `PR_HEAD_SHA=${resolved.expectedHeadSha}\n`,
          );
          NODE

      - name: Create governance App token
        id: governance-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.EE_GOVERNANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EE_GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
          permission-members: read

      - name: Execute trusted governance
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          GOVERNANCE_APP_ID: ${{ vars.EE_GOVERNANCE_APP_ID }}
          GOVERNANCE_PR_TOKEN: ${{ github.token }}
          GOVERNANCE_EVIDENCE_TOKEN: ${{ steps.governance-token.outputs.token }}
          GOVERNANCE_PUBLISHER_TOKEN: ${{ steps.governance-token.outputs.token }}
          GOVERNANCE_WAIT_FOR_APPROVALS: 'true'
          GOVERNANCE_DEDUPLICATE_CHECKS: 'true'
        run: |
          set -euo pipefail
          node scripts/commands/enforce

  dispatch-review:
    name: Queue trusted governance on main
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    permissions:
      actions: write
      contents: read
      pull-requests: read
      checks: read

    steps:
      - name: Dispatch governance verification on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GOVERNANCE_APP_ID: ${{ vars.EE_GOVERNANCE_APP_ID }}
        run: |
          set -euo pipefail

          api_get() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' "$1"
          }

          runs_url="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/governance.yml/runs?event=pull_request_review&per_page=100"
          runs=$(api_get "$runs_url")

          latest_review_run=$(jq -er \
            --argjson pr_number "$PR_NUMBER" \
            '[.workflow_runs[] | select(any(.pull_requests[]?; .number == $pr_number)) | .created_at] | max // error("No review workflow run found for this PR")' \
            <<< "$runs")

          runs=$(api_get "$runs_url")
          newer_review_runs=$(jq -er \
            --argjson current_run "$GITHUB_RUN_NUMBER" \
            --argjson pr_number "$PR_NUMBER" \
            '[.workflow_runs[] | select(.run_number > $current_run) | select(any(.pull_requests[]?; .number == $pr_number)) | select(.status != "completed" or .conclusion == "success")] | length' \
            <<< "$runs")

          if (( newer_review_runs > 0 )); then
            echo "A newer review event superseded this relay; it will dispatch the consolidated governance run."
            exit 0
          fi

          pull_request=$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          current_head_sha=$(jq -er '.head.sha | strings' <<< "$pull_request")
          base_ref=$(jq -er '.base.ref | strings' <<< "$pull_request")
          base_repository=$(jq -er '.base.repo.full_name | strings' <<< "$pull_request")

          if [[ "$base_ref" != "main" || "$base_repository" != "$GITHUB_REPOSITORY" || "$current_head_sha" != "$PR_HEAD_SHA" ]]; then
            echo "The review relay is stale or the pull request is outside the trusted base; a later CI or review event will reconcile current state."
            exit 0
          fi

          validate_checks=$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$current_head_sha/check-runs?check_name=Validate&app_id=15368&filter=latest&per_page=100")
          validate_ready=$(jq -r '[.check_runs[] | select(.name == "Validate" and .app.id == 15368 and .status == "completed" and .conclusion == "success")] | length > 0' <<< "$validate_checks")

          if [[ "$validate_ready" != "true" ]]; then
            echo "Validate has not passed for the current HEAD; its successful CI completion will reconcile governance."
            exit 0
          fi

          governance_checks=$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$current_head_sha/check-runs?check_name=PR%20Governance&app_id=$GOVERNANCE_APP_ID&filter=latest&per_page=100")
          governance_already_current=$(jq -r \
            --argjson app_id "$GOVERNANCE_APP_ID" \
            --arg latest_review_run "$latest_review_run" \
            '[.check_runs[] | select(.name == "PR Governance" and .app.id == $app_id and .created_at >= $latest_review_run and ((.status != "completed") or (.conclusion == "success")))] | length > 0' \
            <<< "$governance_checks")

          if [[ "$governance_already_current" == "true" ]]; then
            echo "A current PR Governance check already includes the latest review event."
            exit 0
          fi

          payload=$(jq -n \
            --arg ref main \
            --arg pr_number "$PR_NUMBER" \
            --arg head_sha "$PR_HEAD_SHA" \
            '{ref: $ref, inputs: {pr_number: $pr_number, head_sha: $head_sha}}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/governance.yml/dispatches" \
            --data "$payload"

  reconcile:
    name: PR Governance Reconcile
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'pull_request' ||
        github.event.workflow_run.event == 'pull_request_review')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: governance-main

    permissions:
      contents: read
      pull-requests: read
      checks: read

    steps:
      - name: Checkout trusted implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Create governance App token
        id: governance-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.EE_GOVERNANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EE_GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
          permission-members: read

      - name: Reconcile open PRs
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GOVERNANCE_APP_ID: ${{ vars.EE_GOVERNANCE_APP_ID }}
          GOVERNANCE_PR_TOKEN: ${{ github.token }}
          GOVERNANCE_EVIDENCE_TOKEN: ${{ steps.governance-token.outputs.token }}
          GOVERNANCE_PUBLISHER_TOKEN: ${{ steps.governance-token.outputs.token }}
        run: |
          set -euo pipefail
          node scripts/commands/reconcile
