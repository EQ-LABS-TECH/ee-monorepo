# EE-LABS release publication — governed by EE-DOC-007 and EE-DOC-011
name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect root version change
        id: release
        shell: bash
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_BEFORE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid pre-push commit SHA; refusing ambiguous release detection." >&2
            exit 1
          fi

          # Initial push: there is no prior commit to compare.
          if [[ "$RELEASE_BEFORE" =~ ^0{40}$ ]]; then
            echo "No previous commit exists; skipping release detection."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${RELEASE_BEFORE}^{commit}"; then
            echo "Previous push commit is unavailable; refusing ambiguous release detection." >&2
            exit 1
          fi

          if ! git cat-file -e "HEAD:package.json" ||
             ! git cat-file -e "${RELEASE_BEFORE}:package.json"; then
            echo "Root package.json is missing from a compared commit." >&2
            exit 1
          fi

          previous_version="$(
            git show "${RELEASE_BEFORE}:package.json" |
              node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))"
          )"
          current_version="$(node -p "require('./package.json').version")"

          if [[ ! "$previous_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ||
                ! "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid root package version; refusing release detection." >&2
            exit 1
          fi

          if [[ "$previous_version" != "$current_version" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Root version changed: $previous_version -> $current_version"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Root version unchanged; skipping release publication."
          fi

      - name: Setup pnpm
        if: steps.release.outputs.changed == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        if: steps.release.outputs.changed == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.release.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify release manifest contract
        if: steps.release.outputs.changed == 'true'
        shell: bash
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_BEFORE" =~ ^[0-9a-f]{40}$ ||
                "$RELEASE_BEFORE" =~ ^0{40}$ ]]; then
            echo "Invalid release base for manifest verification." >&2
            exit 1
          fi

          previous_version="$(
            git show "${RELEASE_BEFORE}:package.json" |
              node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))"
          )"

          current_version="$(node -p "require('./package.json').version")"

          set +e
          git diff --quiet "$RELEASE_BEFORE" HEAD -- scripts/release-manifest.json
          diff_status=$?
          set -e

          if [[ "$diff_status" -eq 0 ]]; then
            echo "Root version changed without a manifest change." >&2
            exit 1
          fi

          if [[ "$diff_status" -ne 1 ]]; then
            echo "Unable to inspect release manifest diff." >&2
            exit 1
          fi

          PREVIOUS_VERSION="$previous_version" \
          CURRENT_VERSION="$current_version" \
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import {
            validateReleaseTrigger,
          } from './scripts/lib/release-integrity.mjs';

          const manifest = JSON.parse(
            readFileSync('scripts/release-manifest.json', 'utf8'),
          );

          const result = validateReleaseTrigger({
            previousVersion: process.env.PREVIOUS_VERSION,
            currentVersion: process.env.CURRENT_VERSION,
            manifestChanged: true,
            manifest,
          });

          console.log(
            `Verified release transition: ${result.previousVersion} -> ${result.currentVersion}`,
          );
          console.log(
            `Planned public packages: ${result.publicPackages.length}`,
          );
          NODE

      - name: Prepare historical release dependencies
        if: steps.release.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import {
            prepareHistoricalReleaseDependencies,
          } from './scripts/lib/reconstruct-release-plan.mjs';

          const manifest = JSON.parse(
            readFileSync('scripts/release-manifest.json', 'utf8'),
          );

          const result = prepareHistoricalReleaseDependencies({
            root: process.cwd(),
            manifest,
          });

          console.log('Historical release dependencies prepared and verified.');
          console.log(`Changesets: ${result.changesetIds.length}`);
          console.log(`Planned releases: ${result.releases.length}`);
          NODE

      - name: Publish eligible package versions and create tag
        if: steps.release.outputs.changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm run release -- publish

      - name: Create release publisher token
        id: release_app
        if: steps.release.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.EE_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EE_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push release tag
        if: steps.release.outputs.changed == 'true'
        shell: bash
        env:
          RELEASE_APP_TOKEN: ${{ steps.release_app.outputs.token }}
        run: |
          set -euo pipefail

          if [[ -z "${RELEASE_APP_TOKEN}" ]]; then
            echo "Release publisher token is unavailable." >&2
            exit 1
          fi

          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          auth_header="$(
            printf 'x-access-token:%s' "${RELEASE_APP_TOKEN}" | base64 -w 0
          )"

          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}" \
            git -c credential.helper= push origin "refs/tags/${tag}:refs/tags/${tag}"

      - name: Verify remote release tag
        if: steps.release.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          remote_refs="$(
            git ls-remote --tags origin \
              "refs/tags/${tag}" \
              "refs/tags/${tag}^{}"
          )"

          REMOTE_REFS="$remote_refs" \
          RELEASE_TAG="$tag" \
          EXPECTED_COMMIT="$GITHUB_SHA" \
          node --input-type=module <<'NODE'
          import {
            inspectRemoteReleaseTag,
          } from './scripts/lib/release-integrity.mjs';

          const tag = process.env.RELEASE_TAG;
          const expectedCommit = process.env.EXPECTED_COMMIT;
          const refs = process.env.REMOTE_REFS;

          const result = inspectRemoteReleaseTag({
            tag,
            expectedCommit,
            remoteTagRefs: () => refs,
          });

          if (result.state !== 'matches') {
            throw new Error(
              `Remote tag verification failed: ${result.state}`,
            );
          }

          console.log(
            `Verified ${tag} -> ${result.targetCommit}`,
          );
          NODE
